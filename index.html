<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kemena - AI-powered Artist Intelligence Dashboard for data-driven music career growth">
  <meta name="theme-color" content="#0a0e17">
  <title>Kemena Analytics Intelligence</title>
  
  <!-- External Libraries -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
  <script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="./src/styles/dashboard.css">
</head>
<body>
  <div id="root"></div>

  <!-- Configuration -->
  <script src="./src/utils/config.js"></script>
  
  <!-- Utilities -->
  <script src="./src/utils/analytics.js"></script>

  <!-- Main Application -->
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { 
      LineChart, Line, BarChart, Bar, PieChart, Pie, Cell, 
      XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, 
      RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, Radar 
    } = Recharts;

    /**
     * KPI Card Component
     */
    const KPICard = ({ label, value, change, changeType, subtitle }) => (
      <div className="kpi-card">
        <div className="kpi-label">{label}</div>
        <div className="kpi-value">{value}</div>
        {change && (
          <div className={`kpi-change ${changeType}`}>
            {change}
          </div>
        )}
        {subtitle && (
          <div style={{ fontSize: '0.85rem', color: '#8b92a8' }}>
            {subtitle}
          </div>
        )}
      </div>
    );

    /**
     * Insight Box Component
     */
    const InsightBox = ({ title, metric, text }) => (
      <div className="insight-box">
        <div className="insight-title">{title} — {metric}</div>
        <div className="insight-text">{text}</div>
      </div>
    );

    /**
     * Opportunity Card Component
     */
    const OpportunityCard = ({ title, impact, score, analysis, recommendation }) => (
      <div className="opportunity-card">
        <div className="opportunity-score">
          IMPACT: {impact} | PRIORITY: {score}/100
        </div>
        <div style={{ fontWeight: 600, fontSize: '1.1rem', marginBottom: '10px', color: '#fff' }}>
          {title}
        </div>
        <div style={{ marginBottom: '15px', color: '#c5c9d6' }}>
          <strong>Analysis:</strong> {analysis}
        </div>
        <div style={{ color: '#ff9800', fontWeight: 500 }}>
          <strong>Action:</strong> {recommendation}
        </div>
      </div>
    );

    /**
     * Metric Row Component
     */
    const MetricRow = ({ name, value }) => (
      <div className="metric-row">
        <span className="metric-name">{name}</span>
        <span className="metric-value">{value}</span>
      </div>
    );

    /**
     * Error Boundary Wrapper
     */
    const ErrorBoundary = ({ children, fallback }) => {
      const [hasError, setHasError] = useState(false);

      useEffect(() => {
        const handleError = () => setHasError(true);
        window.addEventListener('error', handleError);
        return () => window.removeEventListener('error', handleError);
      }, []);

      if (hasError) {
        return (
          <div className="error-container">
            <h2>⚠️ Error Loading Dashboard</h2>
            <p>Something went wrong. Please refresh the page.</p>
            {fallback && fallback}
          </div>
        );
      }

      return children;
    };

    /**
     * Main Dashboard Component
     */
    const KemenaDashboard = () => {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        loadAnalyticsData();
      }, []);

      /**
       * Load analytics data from JSON file
       */
      const loadAnalyticsData = async () => {
        try {
          setLoading(true);
          setError(null);

          // Fetch analytics data
          const response = await fetch(CONFIG.DATA_URL);
          if (!response.ok) throw new Error('Failed to load analytics data');

          const rawData = await response.json();

          // Validate data
          if (!validateMetricsData(rawData)) {
            throw new Error('Invalid analytics data structure');
          }

          // Generate insights
          const insights = generateInsights(rawData);
          const enrichedData = { ...rawData, insights };

          // Save to history
          if (CONFIG.STORAGE.STORAGE_ENABLED) {
            saveToHistory(rawData, CONFIG.STORAGE.MAX_HISTORY_ITEMS);
          }

          setData(enrichedData);
        } catch (err) {
          console.error('Error loading analytics:', err);
          setError(err.message || 'Failed to load analytics data');
        } finally {
          setLoading(false);
        }
      };

      // Loading state
      if (loading) {
        return (
          <div className="loading-container">
            <p>Loading analytics...</p>
          </div>
        );
      }

      // Error state
      if (error || !data) {
        return (
          <div className="error-container">
            <h2>⚠️ Unable to Load Dashboard</h2>
            <p>{error || 'Unknown error occurred'}</p>
            <button 
              onClick={loadAnalyticsData}
              style={{
                marginTop: '20px',
                padding: '10px 20px',
                background: '#667eea',
                color: '#fff',
                border: 'none',
                borderRadius: '6px',
                cursor: 'pointer',
                fontWeight: 600
              }}
            >
              Retry
            </button>
          </div>
        );
      }

      // Prepare data for charts
      const platformData = [
        { name: 'Spotify', followers: data.spotify.followers.total },
        { name: 'YouTube', followers: data.youtube.subscribers.total },
        { name: 'Instagram', followers: data.social.instagram.followers },
        { name: 'Facebook', followers: data.social.facebook.followers }
      ];

      const growthData = [
        { 
          platform: 'Spotify', 
          growth: formatPercent(
            (data.spotify.followers.change_1m / data.spotify.followers.total * 100)
          ) 
        },
        { 
          platform: 'YouTube', 
          growth: formatPercent(
            (data.youtube.subscribers.change_1m / data.youtube.subscribers.total * 100)
          ) 
        },
        { platform: 'Instagram', growth: '0%' }
      ];

      const performanceData = [
        { metric: 'Engagement', value: 98 },
        { metric: 'Discovery', value: 45 },
        { metric: 'Conversion', value: 72 },
        { metric: 'Retention', value: 65 },
        { metric: 'Virality', value: 38 }
      ];

      const COLORS = CONFIG.UI.COLORS;

      // Render dashboard
      return (
        <div className="dashboard">
          {/* Header */}
          <div className="header">
            <div>
              <h1>{CONFIG.APP_NAME}</h1>
              <div style={{ fontSize: '0.9rem', color: '#8b92a8', marginTop: '5px' }}>
                {CONFIG.APP_SUBTITLE}
              </div>
            </div>
            {CONFIG.DISPLAY.SHOW_TIMESTAMPS && (
              <div className="timestamp">
                Generated: {new Date(data.timestamp).toLocaleString(
                  CONFIG.DISPLAY.TIMESTAMP_FORMAT,
                  {
                    month: 'long',
                    day: 'numeric',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                  }
                )}
              </div>
            )}
          </div>

          {/* KPI Cards */}
          <div className="kpi-grid">
            <KPICard
              label="Total Digital Reach"
              value={formatNumber(data.insights.executive.total_reach)}
              subtitle="Cross-platform audience"
            />
            <KPICard
              label="Monthly Streams"
              value={formatNumber(Math.round(data.spotify.streams.monthly / 1000)) + 'K'}
              change="-3.1% MoM"
              changeType="negative"
            />
            <KPICard
              label="Engagement Multiplier"
              value={data.insights.executive.engagement_multiplier + 'x'}
              subtitle="Top quartile performance"
            />
            <KPICard
              label="Momentum Score"
              value={data.insights.executive.momentum_score}
              subtitle="Out of 100"
            />
          </div>

          {/* Charts Section */}
          {CONFIG.CHARTS.SHOW_PLATFORM_DISTRIBUTION || CONFIG.CHARTS.SHOW_GROWTH_VELOCITY ? (
            <div className="two-column-grid">
              {CONFIG.CHARTS.SHOW_PLATFORM_DISTRIBUTION && (
                <div className="section">
                  <div className="section-title">Platform Distribution</div>
                  <ResponsiveContainer width="100%" height={CONFIG.CHARTS.DEFAULT_HEIGHT}>
                    <PieChart>
                      <Pie
                        data={platformData}
                        cx="50%"
                        cy="50%"
                        labelLine={false}
                        label={({ name, percent }) => `${name} ${(percent * 100).toFixed(0)}%`}
                        outerRadius={100}
                        fill="#8884d8"
                        dataKey="followers"
                      >
                        {platformData.map((entry, index) => (
                          <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                        ))}
                      </Pie>
                      <Tooltip />
                    </PieChart>
                  </ResponsiveContainer>
                </div>
              )}

              {CONFIG.CHARTS.SHOW_GROWTH_VELOCITY && (
                <div className="section">
                  <div className="section-title">30-Day Growth Velocity</div>
                  <ResponsiveContainer width="100%" height={CONFIG.CHARTS.DEFAULT_HEIGHT}>
                    <BarChart data={growthData}>
                      <CartesianGrid strokeDasharray="3 3" stroke="#2a3142" />
                      <XAxis dataKey="platform" stroke="#8b92a8" />
                      <YAxis stroke="#8b92a8" />
                      <Tooltip contentStyle={{ background: '#1e2530', border: '1px solid #2a3142' }} />
                      <Bar dataKey="growth" fill="#667eea" />
                    </BarChart>
                  </ResponsiveContainer>
                </div>
              )}
            </div>
          ) : null}

          {/* Performance Radar */}
          {CONFIG.CHARTS.SHOW_PERFORMANCE_RADAR && (
            <div className="section">
              <div className="section-title">Performance Radar</div>
              <ResponsiveContainer width="100%" height={CONFIG.CHARTS.RADAR_HEIGHT}>
                <RadarChart data={performanceData}>
                  <PolarGrid stroke="#2a3142" />
                  <PolarAngleAxis dataKey="metric" stroke="#8b92a8" />
                  <PolarRadiusAxis stroke="#8b92a8" />
                  <Radar name="Kemena" dataKey="value" stroke="#667eea" fill="#667eea" fillOpacity={0.6} />
                  <Tooltip contentStyle={{ background: '#1e2530', border: '1px solid #2a3142' }} />
                </RadarChart>
              </ResponsiveContainer>
            </div>
          )}

          {/* Strategic Intelligence */}
          <div className="section">
            <div className="section-title">Strategic Intelligence</div>
            {data.insights.strengths.length > 0 ? (
              data.insights.strengths.map((strength, i) => (
                <InsightBox
                  key={i}
                  title={strength.title}
                  metric={strength.metric}
                  text={strength.insight}
                />
              ))
            ) : (
              <p style={{ color: '#8b92a8' }}>No strengths identified yet.</p>
            )}
          </div>

          {/* Critical Opportunities */}
          <div className="section">
            <div className="section-title">Critical Opportunities</div>
            {data.insights.critical_opportunities.length > 0 ? (
              data.insights.critical_opportunities.map((opp, i) => (
                <OpportunityCard
                  key={i}
                  title={opp.title}
                  impact={opp.impact}
                  score={opp.score}
                  analysis={opp.analysis}
                  recommendation={opp.recommendation}
                />
              ))
            ) : (
              <p style={{ color: '#8b92a8' }}>No critical opportunities identified.</p>
            )}
          </div>

          {/* Strategic Imperatives */}
          {CONFIG.FEATURES.SHOW_STRATEGIC_IMPERATIVES && (
            <div className="section">
              <div className="section-title">Strategic Imperatives</div>
              {data.insights.strategic_imperatives.map((imperative, i) => (
                <div key={i} style={{ padding: '15px 0', borderBottom: '1px solid #2a3142' }}>
                  <span style={{ color: '#667eea', fontWeight: 600, marginRight: '10px' }}>
                    {String(i + 1).padStart(2, '0')}
                  </span>
                  {imperative}
                </div>
              ))}
            </div>
          )}

          {/* Comparative Intelligence */}
          {CONFIG.FEATURES.SHOW_COMPARATIVES && (
            <div className="section">
              <div className="section-title">Comparative Intelligence</div>
              <MetricRow name="Spotify Performance Percentile" value="Top 27%" />
              <MetricRow name="YouTube Performance Percentile" value="Top 22%" />
              <MetricRow name="Social Media Performance Percentile" value="Top 47%" />
              <MetricRow name="Afrobeat Genre Ranking" value="#3,614 / 14,000+" />
              <MetricRow name="Nigeria National Ranking" value="#2,638" />
            </div>
          )}

          {/* Footer */}
          <div style={{ textAlign: 'center', marginTop: '60px', color: '#8b92a8', fontSize: '0.85rem' }}>
            <p>Kemena Analytics • Data-Driven Artist Intelligence</p>
            <p>Last updated: {new Date().toLocaleDateString()}</p>
          </div>
        </div>
      );
    };

    /**
     * Render application
     */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <KemenaDashboard />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
